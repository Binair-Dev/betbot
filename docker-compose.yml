services:
  bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: betbot-bot
    env_file:
      - .env
    volumes:
      - ./data:/app/data
    environment:
      - PYTHONPATH=/app
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import sqlite3; sqlite3.connect('/app/data/betbot.db').close()"]
      interval: 60s
      timeout: 10s
      retries: 3
    networks:
      - betbot-net

  dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: betbot-dashboard
    env_file:
      - .env
    working_dir: /app
    command: >
      sh -c "streamlit run /app/dashboard/app.py
             --server.port=8501
             --server.address=0.0.0.0
             --server.headless=true
             --server.runOnSave=false
             --browser.gatherUsageStats=false"
    ports:
      - "8501:8501"
    volumes:
      - ./data:/app/data
      - ./dashboard:/app/dashboard
    environment:
      - PYTHONPATH=/app
      - HOME=/app
    depends_on:
      - bot
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - betbot-net

networks:
  betbot-net:
    driver: bridge
