services:
  bot:
    build:
      context: .
      dockerfile: Dockerfile
    image: binair/betbot:latest
    container_name: betbot-bot
    env_file:
      - .env
    working_dir: /app
    command: ["bot"]
    volumes:
      - bot-data:/app/data
    environment:
      - PYTHONPATH=/app
      - HOME=/app
      - TZ=Europe/Brussels
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import sqlite3; sqlite3.connect('/app/data/betbot.db').close()"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - betbot-net

  dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    image: binair/betbot:latest
    container_name: betbot-dashboard
    env_file:
      - .env
    working_dir: /app
    command: ["dashboard"]
    ports:
      - "8501:8501"
    volumes:
      - bot-data:/app/data
    environment:
      - PYTHONPATH=/app
      - HOME=/app
      - TZ=Europe/Brussels
      - STREAMLIT_SERVER_BASE_URL_PATH=/
    depends_on:
      - bot
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - betbot-net

networks:
  betbot-net:
    driver: bridge

volumes:
  bot-data:
    name: betbot-data
